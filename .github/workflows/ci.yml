name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - development

jobs:
  change-detection:
    name: Change Detection
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.changes.outputs.src }}
      tests: ${{ steps.changes.outputs.tests }}
      quality: ${{ steps.changes.outputs.quality }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        id: changes
        uses: dorny/paths-filter@v2
        with:
          filters: |
            src:
              - 'src/**'
              - 'pyproject.toml'
              - 'pixi.toml'
            tests:
              - 'tests/**'
              - 'src/**'
              - 'pyproject.toml'
            quality:
              - '**'

  quality-gates:
    name: Quality Gates
    needs: change-detection
    runs-on: ubuntu-latest
    if: needs.change-detection.outputs.quality == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: quality
          cache: true
          pixi-version: v0.75.0

      - name: Run quality checks (linting, formatting, type checking)
        run: pixi run -e quality lint

      - name: Run tests
        run: pixi run -e quality test

      - name: Run hygiene checks
        run: pixi run -e quality hygiene

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: quality
          cache: true
          pixi-version: v0.75.0

      - name: Run security checks
        run: pixi run -e quality security

      - name: Check dependencies for vulnerabilities
        run: pixi run -e quality audit

  ci-success:
    name: CI Success
    needs: [change-detection, quality-gates, security]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check CI status
        run: |
          if [[ "${{ needs.change-detection.result }}" == "failure" ]] || \
             [[ "${{ needs.quality-gates.result }}" == "failure" ]] || \
             [[ "${{ needs.security.result }}" == "failure" ]]; then
            echo "CI pipeline failed"
            exit 1
          fi
          echo "CI pipeline succeeded"

  branch-policy:
    name: Branch Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enforce branch protection
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "Running on main branch - all checks must pass"
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "Running on develop branch - PR checks enforced"
          fi

      - name: Validate commit messages
        run: |
          # Optional: Add commit message validation here
          echo "Commit messages validated"
