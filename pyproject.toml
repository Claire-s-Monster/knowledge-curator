[project]
name = "knowledge-curator"
version = "0.1.0"
description = "LLM-powered knowledge curation daemon for UCKN"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []  # Managed by pixi

[tool.setuptools]
packages = ["knowledge_curator"]
package-dir = {"" = "src"}

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = true
strict = true

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["src/knowledge_curator"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# =============================================================================
# PIXI CONFIGURATION
# =============================================================================

[tool.pixi.project]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
# Core runtime
python = ">=3.12"
pydantic = ">=2.10"
pydantic-settings = ">=2.0.0"
httpx = ">=0.28"
fastapi = ">=0.115"
uvicorn = ">=0.34"
apscheduler = ">=3.10"
loguru = ">=0.7"
python-dotenv = ">=1.1"
pyyaml = ">=6.0"
anthropic = ">=0.42"

# Database
aiosqlite = ">=0.20"

[tool.pixi.feature.quality.dependencies]
pytest = ">=8.4"
pytest-cov = ">=4.0"
pytest-asyncio = ">=1.0"
pytest-timeout = ">=2.1"
ruff = ">=0.5"
mypy = ">=1.11"

[tool.pixi.feature.dev.dependencies]
ipython = ">=8.0"
rich = ">=13.0"

[tool.pixi.environments]
default = {features = [], solve-group = "default"}
quality = {features = ["quality"], solve-group = "quality"}
dev = {features = ["quality", "dev"], solve-group = "dev"}

[tool.pixi.tasks]
# Development
curator = "python -m knowledge_curator"
curator-dev = { cmd = "python -m knowledge_curator", env = { LOG_LEVEL = "DEBUG" } }

[tool.pixi.feature.quality.tasks]
# Testing (requires quality environment)
test = { cmd = "pytest tests/ -v", env = { PYTHONPATH = "src" } }
test-cov = { cmd = "pytest tests/ --cov=knowledge_curator --cov-report=term-missing", env = { PYTHONPATH = "src" } }

# Quality (also in quality feature)
lint = "ruff check src/"
lint-fix = "ruff check --fix src/"
format = "ruff format src/"
format-check = "ruff format --check src/"
typecheck = "mypy src/"
quality = { depends-on = ["lint", "format-check", "typecheck"] }

[tool.pixi.tasks.db-init]
cmd = "python -c 'from knowledge_curator.database.repository import init_db; init_db()'"

[tool.pixi.tasks.db-reset]
cmd = "rm -f curator.db && pixi run db-init"

[tool.pixi.tasks.clean]
cmd = "rm -rf __pycache__ .pytest_cache .coverage .ruff_cache .mypy_cache"
